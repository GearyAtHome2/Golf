apply plugin: 'com.android.application'

configurations { natives }

dependencies {
    implementation project(":core")
    api "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}

android {
    namespace "com.gearygolf.golf"
    compileSdk 36
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            def keyProps = new Properties()
            def keyFile = rootProject.file('android/key.properties')
            if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }
            storeFile     = rootProject.file(keyProps.getProperty('storeFile', ''))
            storePassword = keyProps.getProperty('storePassword', '')
            keyAlias      = keyProps.getProperty('keyAlias', '')
            keyPassword   = keyProps.getProperty('keyPassword', '')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }
    defaultConfig {
        applicationId "com.gearygolf.golf"
        minSdk 21
        targetSdk 35
        versionCode 19
        versionName "1.0"

        // Read secrets from android/key.properties (gitignored — never commit that file).
        def keyProps = new Properties()
        def keyFile = rootProject.file('android/key.properties')
        if (keyFile.exists()) {
            keyFile.withInputStream { keyProps.load(it) }
        }
        buildConfigField "String", "FIREBASE_API_KEY", "\"${keyProps.getProperty('firebaseApiKey', '')}\""
        buildConfigField "String", "WEB_CLIENT_ID",    "\"${keyProps.getProperty('webClientId', '')}\""
    }
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false  // store .so uncompressed so the OS can map them
        }                               // directly from the APK — required for 16 KB page alignment
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

task copyNatives {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.contains("arm64-v8a")) outputDir = file("libs/arm64-v8a")
            else if (jar.name.contains("armeabi-v7a")) outputDir = file("libs/armeabi-v7a")
            else if (jar.name.contains("x86_64")) outputDir = file("libs/x86_64")
            else if (jar.name.contains("x86")) outputDir = file("libs/x86")

            if (outputDir != null) {
                outputDir.mkdirs()
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

project.afterEvaluate {
    tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach {
        dependsOn copyNatives
    }

    // Re-align the release APK to 16 KB page boundaries after AGP signs/packages it.
    // AGP's experimental alignment flag is unreliable; running zipalign explicitly is the
    // only way to guarantee compliance with the Play Store 16 KB page-size requirement.
    def zipalignExe = android.sdkDirectory.absolutePath
            .replace('\\', '/')
            .with { sdk ->
                def toolsDir = new File("${sdk}/build-tools")
                def latest = toolsDir.listFiles()?.sort()?.last()?.name ?: "36.1.0"
                "${sdk}/build-tools/${latest}/zipalign"
            }
    // On Windows the binary has a .exe extension
    if (System.getProperty("os.name").toLowerCase().contains("win")) {
        zipalignExe += ".exe"
    }

    tasks.matching { it.name == "assembleRelease" }.configureEach {
        doLast {
            def apkDir  = "${buildDir}/outputs/apk/release"
            def srcApk  = "${apkDir}/android-release.apk"
            def dstApk  = "${apkDir}/android-release-aligned.apk"
            if (new File(srcApk).exists()) {
                exec {
                    commandLine zipalignExe, "-p", "-f", "16384", srcApk, dstApk
                }
                println "16 KB-aligned APK written to: ${dstApk}"
            } else {
                println "WARNING: ${srcApk} not found — skipping zipalign step."
            }
        }
    }
}